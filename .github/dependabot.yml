# Weekly dependency updates, grouped so each ecosystem opens at most one PR.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /terraform/aws/scanner-role
      - /terraform/aws/lab
      - /terraform/azure
      - /terraform/gcp
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
