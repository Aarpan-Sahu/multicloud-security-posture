# Nightly keyless scan using OIDC. No long-lived secrets are stored in GitHub.
# Configure repository variables (Settings > Secrets and variables > Actions > Variables)
# for the clouds you want scanned; a cloud without its variables is skipped:
#   AWS:   AWS_SCANNER_ROLE_ARN, AWS_REGIONS
#   Azure: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_IDS
#   GCP:   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SCANNER_SA, GCP_PROJECT_IDS
name: scheduled-scan

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC federation

jobs:
  scan:
    if: vars.AWS_SCANNER_ROLE_ARN != '' || vars.AZURE_CLIENT_ID != '' || vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - if: vars.AWS_SCANNER_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_SCANNER_ROLE_ARN }}
          aws-region: us-east-1
      - if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SCANNER_SA }}

      - name: Scan
        env:
          SCAN_AWS: ${{ vars.AWS_SCANNER_ROLE_ARN != '' }}
          SCAN_AZURE: ${{ vars.AZURE_CLIENT_ID != '' }}
          SCAN_GCP: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          AWS_REGIONS: ${{ vars.AWS_REGIONS }}
          AZURE_SUBSCRIPTION_IDS: ${{ vars.AZURE_SUBSCRIPTION_IDS }}
          GCP_PROJECT_IDS: ${{ vars.GCP_PROJECT_IDS }}
        run: |
          providers=()
          [ "$SCAN_AWS" = "true" ] && providers+=(aws)
          [ "$SCAN_AZURE" = "true" ] && providers+=(azure)
          [ "$SCAN_GCP" = "true" ] && providers+=(gcp)
          python scripts/scan.py --providers "${providers[@]}" --out findings.json --fail-on critical

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: findings-${{ github.run_id }}
          path: findings.json
          retention-days: 30
