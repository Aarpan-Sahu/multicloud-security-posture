name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Demo scan (no cloud credentials needed)
        run: python scripts/scan.py --providers demo --out /tmp/demo.json

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [terraform/aws/scanner-role, terraform/aws/lab, terraform/azure, terraform/gcp]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}
      - run: terraform validate
        working-directory: ${{ matrix.dir }}

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkov (lab is intentionally misconfigured, so it is skipped)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          skip_path: terraform/aws/lab
          framework: terraform
          soft_fail: true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The CLI scans the full history every time. The gitleaks action scans only the pushed
      # range, which breaks on the root commit and after force-pushes.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz gitleaks
          ./gitleaks git . --redact --no-banner --verbose
